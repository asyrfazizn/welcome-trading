<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <style>
    body {
      background-color: #0f172a;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      gap: 12px;
    }
    input, select, button {
      font-size: 1.2rem;
      padding: 10px;
      border-radius: 8px;
      border: none;
    }
    button {
      background-color: #22c55e;
      color: white;
      cursor: pointer;
    }
    #result {
      font-size: 2rem;
      color: #22c55e;
    }
  </style>
</head>
<body>
  <h1>Calculator</h1>

  <input type="number" id="a" placeholder="Nombor pertama">

  <select id="op">
    <option value="+">+ tambah</option>
    <option value="-">- tolak</option>
    <option value="*">× darab</option>
    <option value="/">÷ bahagi</option>
  </select>

  <input type="number" id="b" placeholder="Nombor kedua">

  <button onclick="kira()">Kira</button>

  <div id="result">Jawapan: -</div>

  <script>
    function kira() {
      const a = Number(document.getElementById("a").value);
      const b = Number(document.getElementById("b").value);
      const op = document.getElementById("op").value;
      let jawapan;

      if (op === "+") jawapan = a + b;
      if (op === "-") jawapan = a - b;
      if (op === "*") jawapan = a * b;
      if (op === "/") jawapan = b === 0 ? "Tak boleh bahagi dengan 0" : a / b;

      document.getElementById("result").textContent = "Jawapan: " + jawapan;
    }
  </script>
</body>
</html>
